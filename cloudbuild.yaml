steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${_CLOUDINARY}
      - --build-arg=NEXT_PUBLIC_CONCIERGE_URL=${_CONCIERGE_URL}
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/shop/shop:latest
      - .
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/shop/shop:latest
